        <h3 className="text-base font-semibold">Bienvenue dans {boutiqueName}</h3>
      </div>
      <p className="text-sm mb-4" style={{ color: MUTED }}>Le guide en 6 étapes. Tu peux le rouvrir à tout moment depuis le menu.</p>
      <div className="space-y-3 mb-5">
        {steps.map(([Icon, t, d]) => (
          <div key={t} className="flex gap-3">
            <div style={{ background: "#EEF1F5" }} className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"><Icon size={16} style={{ color: NAVY }} /></div>
            <div><p className="text-sm font-medium">{t}</p><p className="text-xs" style={{ color: MUTED }}>{d}</p></div>
          </div>
        ))}
      </div>
      <button onClick={onClose} style={{ background: ORANGE, color: "#fff" }} className="w-full rounded-lg py-2 text-sm font-medium">J'ai compris</button>
    </ModalShell>
  );
}

function RenameModal({ current, onCancel, onSave, onDone }) {
  const [name, setName] = useState(current);
  const [error, setError] = useState("");
  const save = async () => {
    const n = name.trim();
    if (!n) return setError("Le nom ne peut pas être vide.");
    if (n === current) return onDone();
    const err = await onSave(n);
    if (err) setError(err); else onDone();
  };
  return (
    <ModalShell>
      <h3 className="text-base font-semibold mb-3">Renommer la boutique</h3>
      <input autoFocus value={name} onChange={(e) => setName(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-3 py-2 text-sm" />
      {error && <p className="text-xs mt-2 flex items-center gap-1" style={{ color: RED }}><AlertCircle size={14} />{error}</p>}
      <p className="text-xs mt-2" style={{ color: MUTED }}>Tes données sont conservées, seul le nom change.</p>
      <div className="flex gap-2 mt-4">
        <button onClick={onCancel} style={{ border: `1px solid ${LINE}` }} className="flex-1 rounded-lg py-2 text-sm">Annuler</button>
        <button onClick={save} style={{ background: ORANGE, color: "#fff" }} className="flex-1 rounded-lg py-2 text-sm font-medium">Enregistrer</button>
      </div>
    </ModalShell>
  );
}

function DeleteBoutiqueModal({ boutique, onCancel, onConfirm }) {
  const [typed, setTyped] = useState("");
  const [pin, setPin] = useState("");
  const nameOk = typed.trim().toLowerCase() === boutique.name.trim().toLowerCase();
  const pinOk = !boutique.pinHash || simpleHash(pin) === boutique.pinHash;
  const ok = nameOk && pinOk;
  return (
    <ModalShell>
      <div className="flex items-center gap-2 mb-3">
        <div style={{ background: "#FDEAEA" }} className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"><AlertCircle size={18} style={{ color: RED }} /></div>
        <h3 className="text-base font-semibold">Supprimer cette boutique ?</h3>
      </div>
      <p className="text-sm mb-3" style={{ color: MUTED }}>
        Tous les produits, ventes, dépenses et fournisseurs de <strong>{boutique.name}</strong> seront effacés définitivement. Pense à exporter tes données avant.
      </p>
      <label className="text-xs" style={{ color: MUTED }}>Pour confirmer, écris le nom de la boutique</label>
      <input value={typed} onChange={(e) => setTyped(e.target.value)} placeholder={boutique.name} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-3 py-2 text-sm mt-1 mb-3" />
      {boutique.pinHash && (
        <>
          <label className="text-xs" style={{ color: MUTED }}>Code d'accès de la boutique</label>
          <input value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} placeholder="••••" style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-3 py-2 text-sm mt-1 mb-3 tracking-widest" />
        </>
      )}
      <div className="flex gap-2 mt-2">
        <button onClick={onCancel} style={{ border: `1px solid ${LINE}` }} className="flex-1 rounded-lg py-2 text-sm">Annuler</button>
        <button onClick={onConfirm} disabled={!ok} style={{ background: RED, color: "#fff", opacity: ok ? 1 : 0.4 }} className="flex-1 rounded-lg py-2 text-sm font-medium">Supprimer</button>
      </div>
    </ModalShell>
  );
}

function EmailModal({ onCancel, onSend }) {
  const [email, setEmail] = useState(() => { try { return window.localStorage.getItem("gb_export_email") || ""; } catch (e) { return ""; } });
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const send = async () => {
    setBusy(true);
    try { window.localStorage.setItem("gb_export_email", email.trim()); } catch (e) {}
    const r = await onSend(email.trim());
    setBusy(false);
    if (r === "shared") onCancel();
    else if (r === "mailto") setStatus("Le fichier Excel a été téléchargé et ton application email s'ouvre : ajoute le fichier en pièce jointe, puis envoie.");
  };
  return (
    <ModalShell>
      <div className="flex items-center gap-2 mb-3">
        <div style={{ background: "#FFF1E0" }} className="w-9 h-9 rounded-lg flex items-center justify-center"><Mail size={18} style={{ color: ORANGE }} /></div>
        <h3 className="text-base font-semibold">Envoyer l'export par email</h3>
      </div>
      <label className="text-xs" style={{ color: MUTED }}>Adresse email (la tienne ou celle de ton comptable)</label>
      <input type="email" autoFocus value={email} onChange={(e) => setEmail(e.target.value)} placeholder="nom@exemple.com" style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-3 py-2 text-sm mt-1" />
      <p className="text-xs mt-2" style={{ color: MUTED }}>Sur téléphone, le menu de partage s'ouvre avec le fichier déjà joint (Gmail, WhatsApp…). Sur ordinateur, le fichier est téléchargé puis un brouillon d'email s'ouvre.</p>
      {status && <p className="text-xs mt-2" style={{ color: GREEN }}>{status}</p>}
      <div className="flex gap-2 mt-4">
        <button onClick={onCancel} style={{ border: `1px solid ${LINE}` }} className="flex-1 rounded-lg py-2 text-sm">{status ? "Fermer" : "Annuler"}</button>
        <button onClick={send} disabled={busy} style={{ background: ORANGE, color: "#fff", opacity: busy ? 0.6 : 1 }} className="flex-1 rounded-lg py-2 text-sm font-medium">Envoyer</button>
      </div>
    </ModalShell>
  );
}

// ---------- Racine ----------
function App() {
  const [boutique, setBoutique] = useState(null);
  const rename = async (newName) => {
    const list = (await storeGet("boutiques_list")) || [];
    if (list.some((b) => b.id !== boutique.id && b.name.toLowerCase() === newName.toLowerCase())) return "Ce nom de boutique existe déjà.";
    await storeSet("boutiques_list", list.map((b) => (b.id === boutique.id ? { ...b, name: newName } : b)));
    setBoutique({ ...boutique, name: newName });
    return null;
  };
  if (!boutique) return <LoginScreen onEnter={setBoutique} />;
  return <ShopApp boutique={boutique} onLogout={() => setBoutique(null)} onRename={rename} />;
}


try {
  const __root = ReactDOM.createRoot(document.getElementById("root"));
  __root.render(React.createElement(App));
} catch (e) {
  if (window.onerror) window.onerror(e.message, "", 0, 0, e);
  else throw e;
}

</script>
</body>
</html>
