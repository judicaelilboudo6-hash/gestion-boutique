const simpleHash = (s) => {

// ---------- Ventes à crédit ----------
// Une vente sans champ "credit" est considérée comme entièrement payée.
// Un retour est stocké dans la vente d'origine (mv.returns) : { id, date, qty, refund, cost, restock, cashRefund, reason }.
// Une vente sans retour est inchangée.
const saleReturns = (mv) => mv.returns || [];
const returnedQty = (mv) => saleReturns(mv).reduce((a, r) => a + r.qty, 0);
const returnedValue = (mv) => saleReturns(mv).reduce((a, r) => a + r.refund, 0);
const cashRefunded = (mv) => saleReturns(mv).reduce((a, r) => a + r.cashRefund, 0);
const saleNet = (mv) => mv.totalVente - returnedValue(mv); // valeur de la vente après retours
const salePaid = (mv) => mv.credit ? mv.credit.payments.reduce((a, p) => a + p.amount, 0) : mv.totalVente;
const saleDue = (mv) => mv.type === "vente" ? Math.max(0, saleNet(mv) - salePaid(mv)) : 0;
const saleCash = (mv) => salePaid(mv) - cashRefunded(mv); // argent réellement resté en caisse
// Valeur remboursée pour qty unités (le dernier retour solde exactement la vente, sans écart d'arrondi)
const returnRefundValue = (mv, qty) =>
  qty >= mv.qty - returnedQty(mv) - 1e-9 ? saleNet(mv) : Math.round(mv.totalVente * qty / mv.qty);
// Argent à rendre en espèces : seulement ce que le client a payé en trop après ce retour
const returnCashRefund = (mv, refund) =>
  Math.max(0, salePaid(mv) - (saleNet(mv) - refund)) - Math.max(0, salePaid(mv) - saleNet(mv));
const EMPTY_CREDIT = { on: false, customer: "", deposit: "" };

// ---------- Remises (sur la vente ou le panier entier) ----------
// Une vente sans champ "discount" est comptée sans remise.
const EMPTY_DISCOUNT = { open: false, mode: "amount", value: "" };
const discountAmount = (d, subtotal) => {
  if (!d.open) return 0;
  const v = +d.value || 0;
  if (v <= 0) return 0;
  const raw = d.mode === "percent" ? Math.round(subtotal * v / 100) : v;
  return Math.min(raw, subtotal);
};
const discountError = (d, subtotal) => {
  if (!d.open) return "";
  const v = +d.value || 0;
  if (v < 0) return "La remise ne peut pas être négative.";
  if (d.mode === "percent" && v > 100) return "Le pourcentage ne peut pas dépasser 100 %.";
  if (d.mode === "amount" && v > subtotal) return "La remise dépasse le total de la vente.";
  return "";
};
// Répartit la remise sur les lignes au prorata de leur montant (la dernière absorbe l'arrondi)
const splitDiscount = (lineTotals, discount) => {
  const subtotal = lineTotals.reduce((a, x) => a + x, 0);
  if (!discount || subtotal <= 0) return lineTotals.map(() => 0);
  let left = discount;
  return lineTotals.map((t, i) => {
    const part = i === lineTotals.length - 1 ? left : Math.min(left, Math.round(discount * t / subtotal));
    left -= part;
    return part;
  });
};
const creditError = (c, total) => {
  if (!c.on) return "";
  if (!c.customer.trim()) return "Indique le nom du client pour une vente à crédit.";
  if (+c.deposit < 0) return "L'acompte ne peut pas être négatif.";
  if (+c.deposit > total) return "L'acompte dépasse le total de la vente.";
  return "";
};
const makeCredit = (c, amountPaid) => c.on
  ? { customer: c.customer.trim(), payments: amountPaid > 0 ? [{ id: uid(), date: todayStr(), amount: amountPaid }] : [] }
  : undefined;

function buildExport(boutique, products, movements, expenses) {
  const wb = XLSX.utils.book_new();

  const wsProducts = XLSX.utils.json_to_sheet(products.map((p) => ({
    Nom: p.name,
    Catégorie: p.category || "",
    "Prix d'achat (FCFA)": p.achat,
    "Prix de vente (FCFA)": p.vente,
    "Stock actuel": p.stock,
    "Valeur du stock (FCFA)": p.stock * p.achat,
  })));
  XLSX.utils.book_append_sheet(wb, wsProducts, "Produits");

  const ventes = movements.filter((m) => m.type === "vente");
  const wsVentes = XLSX.utils.json_to_sheet(ventes.map((m) => ({
    Date: m.date,
    Produit: m.productName,
    Quantité: m.qty,
    "Prix unitaire (FCFA)": m.unitVente,
    "Remise (FCFA)": m.discount || 0,
    "Retourné (qté)": returnedQty(m),
    "Remboursé (FCFA)": returnedValue(m),
    "Total vente (FCFA)": m.totalVente,
    "Payé (FCFA)": salePaid(m),
    "Reste à payer (FCFA)": saleDue(m),
    "Client (crédit)": m.credit ? m.credit.customer : "",
  })));
  XLSX.utils.book_append_sheet(wb, wsVentes, "Ventes");

  const entrees = movements.filter((m) => m.type === "entree");
  const wsEntrees = XLSX.utils.json_to_sheet(entrees.map((m) => ({
    Date: m.date,
    Produit: m.productName,
    Quantité: m.qty,
    "Prix unitaire payé (FCFA)": m.unitAchat,
    "Coût total (FCFA)": m.totalAchat,
  })));
  XLSX.utils.book_append_sheet(wb, wsEntrees, "Entrées");

  const wsRetours = XLSX.utils.json_to_sheet(ventes.flatMap((v) => saleReturns(v).map((r) => ({
    Date: r.date,
    Produit: v.productName,
    Quantité: r.qty,
    "Montant remboursé (FCFA)": r.refund,
    "Rendu en espèces (FCFA)": r.cashRefund,
    "Remis en stock": r.restock ? "Oui" : "Non",
    Motif: r.reason || "",
  }))));
  XLSX.utils.book_append_sheet(wb, wsRetours, "Retours");

  const wsExpenses = XLSX.utils.json_to_sheet(expenses.map((e) => ({
    Date: e.date,
    Libellé: e.label,
    "Montant (FCFA)": e.amount,
  })));
  XLSX.utils.book_append_sheet(wb, wsExpenses, "Dépenses");

  const depensesTotal = expenses.reduce((a, d) => a + d.amount, 0);
  const caisseBrute = ventes.reduce((a, v) => a + saleCash(v), 0);
  const coutReassortTotal = entrees.reduce((a, e) => a + (e.totalAchat || 0), 0);
  const wsResume = XLSX.utils.json_to_sheet([
    { Indicateur: "Valeur du stock restant (FCFA)", Valeur: products.reduce((a, p) => a + p.stock * p.achat, 0) },
    { Indicateur: "Caisse — total encaissé, brut (FCFA)", Valeur: caisseBrute },
    { Indicateur: "Créances à recevoir — ventes à crédit (FCFA)", Valeur: ventes.reduce((a, v) => a + saleDue(v), 0) },
    { Indicateur: "Remises accordées, total (FCFA)", Valeur: ventes.reduce((a, v) => a + (v.discount || 0), 0) },
    { Indicateur: "Remboursements rendus en espèces (FCFA)", Valeur: ventes.reduce((a, v) => a + cashRefunded(v), 0) },
    { Indicateur: "Total des dépenses (FCFA)", Valeur: depensesTotal },
    { Indicateur: "Total dépensé en réassorts (FCFA)", Valeur: coutReassortTotal },
    { Indicateur: "Caisse — disponible, net (FCFA)", Valeur: caisseBrute - depensesTotal - coutReassortTotal },
  ]);
  XLSX.utils.book_append_sheet(wb, wsResume, "Résumé");

  const safeName = boutique.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  const fileName = `${safeName}-export-${todayStr()}.xlsx`;
  const summary = `Export de ${boutique.name} du ${todayStr()}\nCaisse disponible : ${fmt(caisseBrute - depensesTotal - coutReassortTotal)}\nValeur du stock : ${fmt(products.reduce((a, p) => a + p.stock * p.achat, 0))}`;
  return { wb, fileName, summary };
}

function exportToExcel(boutique, products, movements, expenses) {
  const { wb, fileName } = buildExport(boutique, products, movements, expenses);
  XLSX.writeFile(wb, fileName);
}

// Envoi par email : partage du fichier (Gmail, WhatsApp…) si le téléphone le permet, sinon téléchargement + brouillon d'email
async function sendExportByEmail(boutique, products, movements, expenses, email) {
  const { wb, fileName, summary } = buildExport(boutique, products, movements, expenses);
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  try {
    const file = new File([out], fileName, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `Export ${boutique.name}`, text: summary });
      return "shared";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return "cancelled";
  }
  XLSX.writeFile(wb, fileName);
  const body = summary + `\n\nLe fichier ${fileName} vient d'être téléchargé : joignez-le à ce message avant de l'envoyer.`;
  window.location.href = `mailto:${encodeURIComponent(email || "")}?subject=${encodeURIComponent("Export " + boutique.name)}&body=${encodeURIComponent(body)}`;
  return "mailto";
}

async function storeGet(key) {
  try {
    const raw = window.localStorage.getItem("gb_" + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
async function storeSet(key, value) {
  try {
    window.localStorage.setItem("gb_" + key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

// ---------- Écran de connexion / choix de boutique ----------
function LoginScreen({ onEnter }) {
  const [boutiques, setBoutiques] = useState(null);
  const [mode, setMode] = useState("list");
  const [selected, setSelected] = useState(null);
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [toDelete, setToDelete] = useState(null);

  const deleteBoutique = async (b) => {
    const newList = boutiques.filter((x) => x.id !== b.id);
    await storeSet("boutiques_list", newList);
    try {
      const prefix = "gb_b_" + b.id + "_";
      Object.keys(window.localStorage).filter((k) => k.indexOf(prefix) === 0).forEach((k) => window.localStorage.removeItem(k));
    } catch (e) {}
    setBoutiques(newList);
    setToDelete(null);
  };

  useEffect(() => {
    (async () => {
      const list = (await storeGet("boutiques_list")) || [];
      setBoutiques(list);
    })();
  }, []);

  const createBoutique = async () => {
    if (!name.trim()) return setError("Donne un nom à ta boutique.");
    const list = boutiques || [];
    if (list.some((b) => b.name.toLowerCase() === name.trim().toLowerCase())) {
      return setError("Ce nom de boutique existe déjà.");
    }
    const entry = { id: uid(), name: name.trim(), pinHash: pin ? simpleHash(pin) : null };
    const newList = [...list, entry];
    await storeSet("boutiques_list", newList);
    setBoutiques(newList);
    onEnter(entry);
  };

  const openBoutique = (b) => {
    setSelected(b);
    setError("");
    if (b.pinHash) setMode("pin");
    else onEnter(b);
  };

  const checkPin = () => {
    if (simpleHash(pin) === selected.pinHash) onEnter(selected);

// ---------- Application principale ----------
function ShopApp({ boutique, onLogout, onRename }) {
  const ns = (k) => `b_${boutique.id}_${k}`;
  const [tab, setTab] = useState("dashboard");
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [products, setProducts] = useState([]);
  const [movements, setMovements] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [guideOpen, setGuideOpen] = useState(false);
  const [renameOpen, setRenameOpen] = useState(false);
  const [emailOpen, setEmailOpen] = useState(false);

  useEffect(() => {
    (async () => {
      const [p, m, e, s] = await Promise.all([
        storeGet(ns("products")), storeGet(ns("movements")), storeGet(ns("expenses")), storeGet(ns("suppliers")),
      ]);
      setProducts(p || []); setMovements(m || []); setExpenses(e || []); setSuppliers(s || []);
      setLoaded(true);
      if (!(await storeGet(ns("guide_seen")))) setGuideOpen(true);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [boutique.id]);

  const persistProducts = useCallback(async (list) => { setProducts(list); await storeSet(ns("products"), list); }, [boutique.id]);
  const persistMovements = useCallback(async (list) => { setMovements(list); await storeSet(ns("movements"), list); }, [boutique.id]);
  const persistExpenses = useCallback(async (list) => { setExpenses(list); await storeSet(ns("expenses"), list); }, [boutique.id]);
  const persistSuppliers = useCallback(async (list) => { setSuppliers(list); await storeSet(ns("suppliers"), list); }, [boutique.id]);

  const stats = useMemo(() => {
    const t = todayStr(), m = monthStr();
    const ventes = movements.filter((mv) => mv.type === "vente");
    const sum = (arr, pred, field) => arr.filter(pred).reduce((a, x) => a + x[field], 0);
    // Les retours sont déduits à la date du retour (chiffre d'affaires et coût des marchandises)
    const retours = ventes.flatMap((v) => saleReturns(v));
    const sumR = (pred, field) => retours.filter(pred).reduce((a, r) => a + r[field], 0);
    const caJour = sum(ventes, (v) => v.date === t, "totalVente") - sumR((r) => r.date === t, "refund");
    const caMois = sum(ventes, (v) => v.date.slice(0, 7) === m, "totalVente") - sumR((r) => r.date.slice(0, 7) === m, "refund");
    const coutJour = sum(ventes, (v) => v.date === t, "totalAchat") - sumR((r) => r.date === t, "cost");
    const coutMois = sum(ventes, (v) => v.date.slice(0, 7) === m, "totalAchat") - sumR((r) => r.date.slice(0, 7) === m, "cost");
    const depJour = sum(expenses, (d) => d.date === t, "amount");
    const depMois = sum(expenses, (d) => d.date.slice(0, 7) === m, "amount");
    const remisesJour = ventes.filter((v) => v.date === t).reduce((a, v) => a + (v.discount || 0), 0);
    const remisesMois = ventes.filter((v) => v.date.slice(0, 7) === m).reduce((a, v) => a + (v.discount || 0), 0);

    // Situation actuelle : valeur du stock restant, et caisse (brute / nette)
    const entrees = movements.filter((mv) => mv.type === "entree");
    const valeurStock = products.reduce((a, p) => a + p.stock * p.achat, 0);
    const caisseBrute = ventes.reduce((a, v) => a + saleCash(v), 0);
    const creances = ventes.reduce((a, v) => a + saleDue(v), 0);
    const depensesTotal = expenses.reduce((a, d) => a + d.amount, 0);
    const coutReassortTotal = entrees.reduce((a, e) => a + (e.totalAchat || 0), 0);
    const caisseNette = caisseBrute - depensesTotal - coutReassortTotal;

    // Classement des produits les plus vendus (historique complet)
    const parProduit = {};
    ventes.forEach((v) => {
      if (!parProduit[v.productId]) parProduit[v.productId] = { productId: v.productId, name: v.productName, qty: 0, revenue: 0, cost: 0 };
      parProduit[v.productId].qty += v.qty - returnedQty(v);
      parProduit[v.productId].revenue += saleNet(v);
      parProduit[v.productId].cost += v.totalAchat - saleReturns(v).reduce((a, r) => a + r.cost, 0);
    });
    const topProducts = Object.values(parProduit)
      .map((p) => ({ ...p, profit: p.revenue - p.cost }))
      .sort((a, b) => b.qty - a.qty)
      .slice(0, 5);

    // Produits à réapprovisionner (rappel pour le vendeur)
    const enRupture = products.filter((p) => p.stock <= 0);
    const stockBas = products.filter((p) => p.stock > 0 && p.stock <= (p.seuil ?? 5));

    // Dépenses par catégorie
    const parCategorie = {};
    expenses.forEach((e) => {
      const key = e.category && e.category.trim() ? e.category.trim() : "Sans catégorie";
      parCategorie[key] = (parCategorie[key] || 0) + e.amount;
    });
    const depensesParCategorie = Object.entries(parCategorie)
      .map(([category, total]) => ({ category, total, pct: depensesTotal > 0 ? (total / depensesTotal) * 100 : 0 }))
      .sort((a, b) => b.total - a.total);

    return {
      caJour, caMois, depJour, depMois, remisesJour, remisesMois,
      beneficeJour: caJour - coutJour - depJour,
      beneficeMois: caMois - coutMois - depMois,
      valeurStock, caisseBrute, caisseNette, creances, topProducts, enRupture, stockBas, depensesParCategorie,
    };
  }, [movements, expenses, products]);

  if (!loaded) {
    return <div style={{ background: PAPER, minHeight: "100%" }} className="flex items-center justify-center text-sm">Chargement des données…</div>;
  }

  const closeGuide = () => { setGuideOpen(false); storeSet(ns("guide_seen"), true); };

  const renderActions = (py, size, close) => {

        <button onClick={run(() => setRenameOpen(true))} className={cls} style={{ color: "#CBD2DE" }}><Pencil size={size} /> <span>Renommer la boutique</span></button>
        <button onClick={run(() => exportToExcel(boutique, products, movements, expenses))} className={cls} style={{ color: "#CBD2DE" }}><Download size={size} /> <span>Exporter (Excel)</span></button>
        <button onClick={run(() => setEmailOpen(true))} className={cls} style={{ color: "#CBD2DE" }}><Mail size={size} /> <span>Envoyer par email</span></button>
      </>
    );
  };

  const NAV = [
    { id: "dashboard", label: "Tableau de bord", icon: LayoutGrid },

    { id: "movements", label: "Mouvements", icon: Repeat },

    stats: "Statistiques",
    expenses: "Dépenses",

  };

  // Le mode caisse occupe tout l'écran, sans la barre latérale
  if (tab === "caisse") {
    return (
      <CaisseMode

            <Store size={16} style={{ color: ORANGE }} />

        <button onClick={() => setMobileMenuOpen(true)} aria-label="Ouvrir le menu"
          className="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: ORANGE }}>

      {/* Barre latérale, desktop uniquement */}
      <div style={{ background: NAVY, color: "#CBD2DE" }} className="hidden md:flex md:w-60 flex-col md:min-h-full">
        <div className="flex-1 p-4">
          <div className="flex items-center gap-2 mb-8 px-1">
            <div style={{ background: NAVY_SOFT }} className="w-8 h-8 rounded-lg flex items-center justify-center">

            </div>
            <div className="leading-tight">
              <p className="text-sm font-semibold text-white truncate">{boutique.name}</p>

          <nav className="flex flex-col gap-1">
            {NAV.map((n) => {

// ---------- Mode caisse : vue plein écran simplifiée pour vendre vite ----------
function CaisseMode({ boutiqueName, products, movements, setProducts, setMovements, onExit }) {
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [cart, setCart] = useState([]); // [{productId, name, price, achat, qty, maxStock}]
  const [receipt, setReceipt] = useState(null);
  const [credit, setCredit] = useState(EMPTY_CREDIT);
  const [discount, setDiscount] = useState(EMPTY_DISCOUNT);
  const [creditErr, setCreditErr] = useState("");

  const categories = [...new Set(products.map((p) => p.category).filter(Boolean))].sort();

  const filtered = products.filter((p) =>
    p.name.toLowerCase().includes(search.toLowerCase()) &&
    (categoryFilter ? p.category === categoryFilter : true)
  );

  const cartQty = (productId) => cart.find((l) => l.productId === productId)?.qty || 0;

  const addToCart = (p) => {
    const already = cartQty(p.id);
    if (already >= p.stock) return;
    setCart((c) => {
      const idx = c.findIndex((l) => l.productId === p.id);
      if (idx === -1) return [...c, { productId: p.id, name: p.name, price: p.vente, achat: p.achat, qty: 1, maxStock: p.stock }];
      const copy = [...c];
      copy[idx] = { ...copy[idx], qty: copy[idx].qty + 1 };
      return copy;
    });
  };

  const changeQty = (productId, delta) => {
    setCart((c) => c
      .map((l) => l.productId === productId ? { ...l, qty: Math.min(l.maxStock, Math.max(0, l.qty + delta)) } : l)
      .filter((l) => l.qty > 0));
  };

  const removeLine = (productId) => setCart((c) => c.filter((l) => l.productId !== productId));

  const total = cart.reduce((a, l) => a + l.qty * l.price, 0);
  const cartCost = cart.reduce((a, l) => a + l.qty * l.achat, 0);
  const discountValue = discountAmount(discount, total);
  const netTotal = total - discountValue;

  const checkout = () => {
    if (cart.length === 0) return;
    const dErr = discountError(discount, total);
    if (dErr) { setCreditErr(dErr); return; }
    const cErr = creditError(credit, netTotal);
    if (cErr) { setCreditErr(cErr); return; }
    setCreditErr("");
    // La remise est répartie sur les lignes au prorata, puis l'acompte dans l'ordre des lignes
    const parts = splitDiscount(cart.map((l) => l.qty * l.price), discountValue);
    const lineNet = cart.map((l, i) => l.qty * l.price - parts[i]);
    let remaining = credit.on ? (+credit.deposit || 0) : 0;
    const payByLine = {};
    cart.forEach((l, i) => { const pay = Math.min(remaining, lineNet[i]); payByLine[l.productId] = pay; remaining -= pay; });
    const paidNow = credit.on ? Math.min(+credit.deposit || 0, netTotal) : netTotal;
    const date = todayStr();
    const newMovements = cart.map((l, i) => ({
      id: uid(), type: "vente", productId: l.productId, productName: l.name, qty: l.qty, date,
      unitVente: l.price, unitAchat: l.achat, totalVente: lineNet[i], totalAchat: l.qty * l.achat,
      ...(parts[i] > 0 ? { discount: parts[i] } : {}),
      ...(credit.on ? { credit: makeCredit(credit, payByLine[l.productId]) } : {}),
    }));
    setMovements([...newMovements, ...movements]);
    setProducts(products.map((p) => {
      const line = cart.find((l) => l.productId === p.id);
      return line ? { ...p, stock: p.stock - line.qty } : p;
    }));
    const now = new Date();
    setReceipt({
      items: cart.map((l) => ({ name: l.name, qty: l.qty, price: l.price })),
      total: netTotal,
      discount: discountValue,
      customer: credit.on ? credit.customer.trim() : "",
      paid: paidNow,
      due: netTotal - paidNow,
      dateLabel: now.toLocaleDateString("fr-FR"),
      timeLabel: now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
    });
    setCart([]);
    setCredit(EMPTY_CREDIT);
    setDiscount(EMPTY_DISCOUNT);
  };

  return (
    <div style={{ background: PAPER, minHeight: "100%", color: TEXT }} className="flex flex-col h-full">
      {/* Barre du haut */}
      <div style={{ background: NAVY }} className="flex items-center justify-between gap-3 px-4 py-3 flex-shrink-0">
        <div className="flex items-center gap-2">
          <div style={{ background: NAVY_SOFT }} className="w-8 h-8 rounded-lg flex items-center justify-center">
            <ShoppingCart size={16} style={{ color: ORANGE }} />

          <span className="text-white text-sm font-semibold">Mode caisse</span>

        <button onClick={onExit} className="flex items-center gap-2 rounded-lg px-3 py-2 text-sm" style={{ color: "#CBD2DE" }}>
          <X size={16} /> Quitter la caisse
        </button>
      </div>

      <div className="flex flex-col lg:flex-row flex-1 overflow-hidden">
        {/* Produits */}

          <div className="flex flex-wrap gap-2 mb-4">
            <div className="relative flex-1 min-w-[200px]">

            </div>
            <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)}

              <option value="">Toutes les catégories</option>

          <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
            {filtered.map((p) => {
              const inCart = cartQty(p.id);
              const disabled = p.stock <= 0 || inCart >= p.stock;
              return (
                <button key={p.id} onClick={() => addToCart(p)} disabled={disabled}
                  style={{ background: CARD, border: `1px solid ${inCart > 0 ? ORANGE : LINE}` }}
                  className="relative text-left rounded-xl p-3 disabled:opacity-40 disabled:cursor-not-allowed active:scale-[0.98] transition-transform">
                  {inCart > 0 && (
                    <span style={{ background: ORANGE, color: "#fff" }} className="absolute -top-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold">
                      {inCart}
                    </span>
                  )}
                  <div style={{ background: PAPER }} className="w-9 h-9 rounded-lg flex items-center justify-center mb-2">
                    <Package size={16} style={{ color: "#9CA3AF" }} />
                  </div>
                  <p className="text-sm font-medium leading-snug">{p.name}</p>
                  <p className="text-xs mt-0.5" style={{ color: MUTED }}>{p.stock <= 0 ? "Rupture" : `${p.stock} en stock`}</p>
                  <p className="text-sm mt-1 font-semibold" style={{ fontFamily: "ui-monospace, monospace", color: ORANGE }}>{fmt(p.vente)}</p>
                </button>
              );
            })}
            {filtered.length === 0 && (
              <p className="col-span-full text-center text-sm py-10" style={{ color: "#9CA3AF" }}>Aucun produit trouvé.</p>
            )}
          </div>
        </div>

        {/* Panier */}
        <div style={{ background: CARD, borderTop: `1px solid ${LINE}`, borderColor: LINE }} className="lg:w-80 flex-shrink-0 flex flex-col lg:border-t-0 lg:border-l">
          <div className="p-4 flex-1 overflow-auto">
            <p className="text-sm font-semibold mb-3">Panier</p>
            {cart.length === 0 ? (
              <p className="text-sm" style={{ color: "#9CA3AF" }}>Touche un produit pour l'ajouter.</p>
            ) : (
              <div className="space-y-3">
                {cart.map((l) => (
                  <div key={l.productId} className="flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <p className="text-sm truncate">{l.name}</p>
                      <p className="text-xs" style={{ color: MUTED, fontFamily: "ui-monospace, monospace" }}>{fmt(l.qty * l.price)}</p>
                    </div>
                    <div className="flex items-center gap-1 flex-shrink-0">
                      <button onClick={() => changeQty(l.productId, -1)} style={{ border: `1px solid ${LINE}` }} className="w-7 h-7 rounded-md flex items-center justify-center"><Minus size={13} /></button>
                      <span className="w-5 text-center text-sm" style={{ fontFamily: "ui-monospace, monospace" }}>{l.qty}</span>
                      <button onClick={() => changeQty(l.productId, 1)} disabled={l.qty >= l.maxStock} style={{ border: `1px solid ${LINE}` }} className="w-7 h-7 rounded-md flex items-center justify-center disabled:opacity-30"><Plus size={13} /></button>
                      <button onClick={() => removeLine(l.productId)} className="w-7 h-7 rounded-md flex items-center justify-center hover:bg-gray-100"><Trash2 size={13} style={{ color: RED }} /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="p-4" style={{ borderTop: `1px solid ${LINE}` }}>
            {cart.length > 0 && <div className="mb-3"><DiscountFields value={discount} onChange={setDiscount} subtotal={total} cost={cartCost} /></div>}
            {cart.length > 0 && <div className="mb-3"><CreditFields value={credit} onChange={setCredit} total={netTotal} /></div>}
            {creditErr && <p className="text-xs flex items-center gap-1 mb-3" style={{ color: RED }}><AlertCircle size={14} />{creditErr}</p>}
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm" style={{ color: MUTED }}>Total</span>
              <span className="text-xl font-semibold" style={{ fontFamily: "ui-monospace, monospace" }}>{fmt(netTotal)}</span>
            </div>
            <button onClick={checkout} disabled={cart.length === 0} style={{ background: ORANGE, color: "#fff" }}
              className="w-full rounded-lg py-3 text-sm font-semibold flex items-center justify-center gap-2 disabled:opacity-40">
              Encaisser
            </button>
          </div>
        </div>
      </div>

      {receipt && (
        <ReceiptModal
          boutiqueName={boutiqueName}
          items={receipt.items}
          total={receipt.total} customer={receipt.customer} paid={receipt.paid} due={receipt.due} discount={receipt.discount}
          dateLabel={receipt.dateLabel}
          timeLabel={receipt.timeLabel}
          onClose={() => setReceipt(null)}
        />
      )}
    </div>
  );
}

function Dashboard({ stats, title, products, movements, setProducts, setMovements, boutiqueName }) {
  const [quickSaleOpen, setQuickSaleOpen] = useState(false);
  const [receipt, setReceipt] = useState(null);

  const confirmQuickSale = (product, qty, price, credit, disc = 0) => {
    const mv = {
      id: uid(), type: "vente", productId: product.id, productName: product.name, qty, date: todayStr(),
      unitVente: price, unitAchat: product.achat, totalVente: qty * price - disc, totalAchat: qty * product.achat,
      ...(disc > 0 ? { discount: disc } : {}),
      ...(credit ? { credit } : {}),
    };
    setMovements([mv, ...movements]);
    setProducts(products.map((p) => p.id === product.id ? { ...p, stock: p.stock - qty } : p));
    const now = new Date();
    setReceipt({
      items: [{ name: product.name, qty, price }],
      total: qty * price - disc,
      discount: disc,
      customer: credit ? credit.customer : "",
      paid: credit ? credit.payments.reduce((a, p) => a + p.amount, 0) : qty * price - disc,
      due: credit ? qty * price - disc - credit.payments.reduce((a, p) => a + p.amount, 0) : 0,
      dateLabel: now.toLocaleDateString("fr-FR"),
      timeLabel: now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
    });
    setQuickSaleOpen(false);
  };

  return (
    <div>
      <PageHeader title={title} />

      <div style={{ background: NAVY }} className="flex flex-wrap items-center justify-between gap-4 rounded-xl p-5 mb-8">
        <div className="flex items-center gap-3">
          <div style={{ background: NAVY_SOFT }} className="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0">
            <Zap size={18} style={{ color: ORANGE }} />
          </div>
          <div>
            <p className="text-sm font-semibold text-white">Un client est là ?</p>
            <p className="text-xs" style={{ color: "#8590A3" }}>Enregistre sa vente en quelques secondes, sans changer d'onglet.</p>
          </div>
        </div>
        <button onClick={() => setQuickSaleOpen(true)} style={{ background: ORANGE, color: "#fff" }}
          className="flex items-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium">
          <Zap size={16} /> Vente rapide
        </button>
      </div>

      {(stats.enRupture.length > 0 || stats.stockBas.length > 0) && (
        <div style={{ background: "#FFF7ED", border: `1px solid #FBDFB0` }} className="rounded-xl p-4 mb-8">
          <div className="flex items-center gap-2 mb-2">
            <AlertCircle size={16} style={{ color: ORANGE }} />
            <p className="text-sm font-semibold" style={{ color: TEXT }}>À réapprovisionner</p>
          </div>
          <div className="flex flex-wrap gap-2">
            {stats.enRupture.map((p) => (
              <span key={p.id} style={{ background: "#FDEAEA", color: RED }} className="text-xs rounded-full px-2.5 py-1">{p.name} — rupture</span>

            {stats.stockBas.map((p) => (
              <span key={p.id} style={{ background: "#FFF1E0", color: ORANGE }} className="text-xs rounded-full px-2.5 py-1">{p.name} — {p.stock} restant{p.stock > 1 ? "s" : ""}</span>

      <p className="text-sm mb-3 font-medium" style={{ color: MUTED }}>Situation actuelle</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-10">
        <StatCard label="Valeur du stock restant" value={stats.valeurStock} icon={Package} />
        <StatCard label="Caisse — total encaissé (brut)" value={stats.caisseBrute} accent={GREEN} icon={Wallet} />
        <StatCard label="Caisse — disponible (net dépenses + réassorts)" value={stats.caisseNette} accent={stats.caisseNette >= 0 ? GREEN : RED} icon={Vault} />
        <StatCard label="À recevoir (ventes à crédit)" value={stats.creances} accent={ORANGE} icon={Coins} />

// ---------- Statistiques : tendance et classement des ventes ----------
function StatsPage({ stats, movements, expenses, title }) {
  const [rangeDays, setRangeDays] = useState(7);

  const trend = useMemo(() => {
    const days = [];
    for (let i = rangeDays - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().slice(0, 10);
      const label = d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
      const ventesJour = movements.filter((m) => m.type === "vente" && m.date === dateStr);
      const retoursJour = movements.filter((m) => m.type === "vente").flatMap((v) => saleReturns(v)).filter((r) => r.date === dateStr);
      const ca = ventesJour.reduce((a, v) => a + v.totalVente, 0) - retoursJour.reduce((a, r) => a + r.refund, 0);
      const cout = ventesJour.reduce((a, v) => a + v.totalAchat, 0) - retoursJour.reduce((a, r) => a + r.cost, 0);
      const dep = expenses.filter((e) => e.date === dateStr).reduce((a, e) => a + e.amount, 0);
      days.push({ date: dateStr, label, ca, benefice: ca - cout - dep });
    }
    return days;
  }, [movements, expenses, rangeDays]);

  return (
    <div>
      <PageHeader title={title} />

      <div className="flex items-center justify-between mb-3">
        <p className="text-sm font-medium" style={{ color: MUTED }}>Évolution du chiffre d'affaires et du bénéfice</p>
        <div className="flex gap-1">
          {[7, 30].map((d) => (
            <button key={d} onClick={() => setRangeDays(d)}
              className="rounded-lg px-3 py-1 text-xs font-medium"
              style={{ background: rangeDays === d ? NAVY : CARD, color: rangeDays === d ? "#fff" : TEXT, border: `1px solid ${LINE}` }}>
              {d} jours
            </button>
          ))}
        </div>
      </div>
      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-4 mb-10">
        <ResponsiveContainer width="100%" height={280}>
          <LineChart data={trend} margin={{ top: 5, right: 10, left: -10, bottom: 0 }}>
            <CartesianGrid stroke={LINE} vertical={false} />
            <XAxis dataKey="label" tick={{ fontSize: 11, fill: MUTED }} axisLine={{ stroke: LINE }} tickLine={false}
              interval={rangeDays === 30 ? 3 : 0} />
            <YAxis tick={{ fontSize: 11, fill: MUTED }} axisLine={false} tickLine={false} width={70}
              tickFormatter={(v) => v >= 1000 ? `${Math.round(v / 1000)}k` : v} />
            <Tooltip formatter={(v) => fmt(v)} labelFormatter={(l) => `Le ${l}`}
              contentStyle={{ borderRadius: 8, border: `1px solid ${LINE}`, fontSize: 12 }} />
            <Legend wrapperStyle={{ fontSize: 12 }} />
            <Line type="monotone" dataKey="ca" name="Chiffre d'affaires" stroke={ORANGE} strokeWidth={2} dot={false} />
            <Line type="monotone" dataKey="benefice" name="Bénéfice net" stroke={GREEN} strokeWidth={2} dot={false} />
          </LineChart>
        </ResponsiveContainer>
      </div>

      <p className="text-sm mb-3 font-medium" style={{ color: MUTED }}>Produits les plus vendus (historique complet)</p>
      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl overflow-hidden">
        {stats.topProducts.length === 0 ? (
          <p className="p-4 text-center text-sm" style={{ color: "#9CA3AF" }}>Aucune vente enregistrée pour l'instant.</p>
        ) : (
          <div className="overflow-x-auto"><table className="w-full text-sm" style={{ minWidth: 560 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${LINE}`, color: MUTED }} className="text-left">
                <th className="p-3 font-normal">Rang</th>
                <th className="p-3 font-normal">Produit</th>
                <th className="p-3 font-normal">Qté vendue</th>
                <th className="p-3 font-normal">CA généré</th>
                <th className="p-3 font-normal">Bénéfice</th>
              </tr>
            </thead>
            <tbody>
              {stats.topProducts.map((p, i) => (
                <tr key={p.productId} style={{ borderTop: `1px solid ${LINE}` }}>
                  <td className="p-3">
                    <div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold"
                      style={{ background: i === 0 ? ORANGE : "#EEF1F5", color: i === 0 ? "#fff" : "#6B7280" }}>
                      {i === 0 ? <Trophy size={13} /> : i + 1}
                    </div>
                  </td>
                  <td className="p-3">{p.name}</td>
                  <td className="p-3" style={{ fontFamily: "ui-monospace, monospace" }}>{p.qty}</td>
                  <td className="p-3" style={{ fontFamily: "ui-monospace, monospace" }}>{fmt(p.revenue)}</td>
                  <td className="p-3" style={{ fontFamily: "ui-monospace, monospace", color: p.profit >= 0 ? GREEN : RED }}>{fmt(p.profit)}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
        )}
      </div>

      <p className="text-sm mb-3 mt-10 font-medium" style={{ color: MUTED }}>Dépenses par catégorie (historique complet)</p>
      {stats.depensesParCategorie.length === 0 ? (
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-4 text-center text-sm">
          <p style={{ color: "#9CA3AF" }}>Aucune dépense enregistrée pour l'instant.</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-4">
            <ResponsiveContainer width="100%" height={Math.max(220, stats.depensesParCategorie.length * 42)}>
              <BarChart data={stats.depensesParCategorie} layout="vertical" margin={{ top: 5, right: 20, left: 10, bottom: 5 }}>
                <CartesianGrid stroke={LINE} horizontal={false} />
                <XAxis type="number" tick={{ fontSize: 11, fill: MUTED }} axisLine={{ stroke: LINE }} tickLine={false}
                  tickFormatter={(v) => v >= 1000 ? `${Math.round(v / 1000)}k` : v} />
                <YAxis type="category" dataKey="category" tick={{ fontSize: 12, fill: TEXT }} axisLine={false} tickLine={false} width={110} />
                <Tooltip formatter={(v) => fmt(v)} contentStyle={{ borderRadius: 8, border: `1px solid ${LINE}`, fontSize: 12 }} />
                <Bar dataKey="total" radius={[0, 6, 6, 0]}>
                  {stats.depensesParCategorie.map((_, i) => <Cell key={i} fill={CAT_COLORS[i % CAT_COLORS.length]} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl overflow-hidden self-start">
            <div className="overflow-x-auto"><table className="w-full text-sm" style={{ minWidth: 560 }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${LINE}`, color: MUTED }} className="text-left">
                  <th className="p-3 font-normal">Catégorie</th>
                  <th className="p-3 font-normal">Total</th>
                  <th className="p-3 font-normal">Part</th>
                </tr>
              </thead>
              <tbody>
                {stats.depensesParCategorie.map((c, i) => (
                  <tr key={c.category} style={{ borderTop: `1px solid ${LINE}` }}>
                    <td className="p-3">
                      <span className="inline-flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: CAT_COLORS[i % CAT_COLORS.length] }} />
                        {c.category}
                      </span>
                    </td>
                    <td className="p-3" style={{ fontFamily: "ui-monospace, monospace", color: RED }}>{fmt(c.total)}</td>
                    <td className="p-3" style={{ fontFamily: "ui-monospace, monospace" }}>{c.pct.toFixed(0)}%</td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          </div>
        </div>
      )}
    </div>
  );
}

          body * { visibility: hidden; }
          .receipt-print, .receipt-print * { visibility: visible; }
          .receipt-print { position: fixed; left: 0; top: 0; width: 100%; padding: 16px; }
          .no-print-inner { display: none !important; }

      <div style={{ background: CARD }} className="w-full max-w-xs rounded-xl overflow-hidden">
        <div className="receipt-print p-5" style={{ fontFamily: "ui-monospace, monospace" }}>
          <div className="text-center mb-3">

              <div key={i} className="flex justify-between text-xs gap-2">
                <span className="flex-1">{it.qty} × {it.name}</span>
                <span>{fmt(it.qty * it.price)}</span>

          {discount > 0 && (

function ReturnModal({ sale, onClose, onConfirm }) {
  const remaining = sale.qty - returnedQty(sale);
  const [qty, setQty] = useState("1");
  const [restock, setRestock] = useState(true);
  const [reason, setReason] = useState("");
  const [error, setError] = useState("");
  const q = +qty || 0;
  const valid = q > 0 && q <= remaining + 1e-9;
  const refund = valid ? returnRefundValue(sale, q) : 0;
  const cash = valid ? returnCashRefund(sale, refund) : 0;
  const debt = refund - cash;
  const impact = refund - (restock ? q * sale.unitAchat : 0);
  const mono = { fontFamily: "ui-monospace, monospace" };

  const confirm = () => {
    if (!valid) return setError(`Quantité invalide (maximum ${remaining}).`);
    onConfirm({ id: uid(), date: todayStr(), qty: q, refund, cost: restock ? q * sale.unitAchat : 0, restock, cashRefund: cash, reason: reason.trim() });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(16,27,46,0.45)" }}>
      <div style={{ background: CARD }} className="w-full max-w-sm rounded-xl p-5 max-h-full overflow-auto">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <RotateCcw size={17} style={{ color: ORANGE }} />
            <h3 className="text-base font-semibold">Retour d'un client</h3>
          </div>
          <button onClick={onClose}><X size={18} style={{ color: MUTED }} /></button>
        </div>
        <div className="text-xs mb-4 space-y-0.5" style={{ color: MUTED }}>
          <p><span style={{ color: TEXT, fontWeight: 600 }}>{sale.productName}</span> — vendu le {sale.date}{sale.credit ? ` à ${sale.credit.customer}` : ""}</p>
          <p>Vendu : {sale.qty} · déjà retourné : {returnedQty(sale)} · retournable : {remaining}</p>
        </div>

        <div className="space-y-3">
          <div>
            <label className="text-xs" style={{ color: MUTED }}>Quantité retournée</label>
            <input type="number" value={qty} onChange={(e) => setQty(e.target.value)} autoFocus
              style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
          </div>
          <label className="flex items-start gap-2 text-sm cursor-pointer select-none">
            <input type="checkbox" checked={restock} onChange={(e) => setRestock(e.target.checked)} className="mt-1" />
            <span>Remettre les articles en stock
              <span className="block text-xs" style={{ color: MUTED }}>Décoche si l'article est abîmé : il ne sera pas remis en vente.</span>
            </span>
          </label>
          <div>
            <label className="text-xs" style={{ color: MUTED }}>Motif (optionnel)</label>
            <input value={reason} onChange={(e) => setReason(e.target.value)} placeholder="Ex : défectueux, mauvaise taille"
              style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
          </div>

          {valid && (
            <div style={{ background: "#FFF7ED", border: "1px solid #FBDFB0" }} className="rounded-lg p-3 text-xs space-y-1">
              <div className="flex justify-between"><span>Valeur du retour</span><span style={mono}>{fmt(refund)}</span></div>
              {cash > 0 && <div className="flex justify-between font-semibold" style={{ color: TEXT }}><span>À rendre au client en espèces</span><span style={mono}>{fmt(cash)}</span></div>}
              {debt > 0 && <div className="flex justify-between"><span>Déduit de ce que le client doit</span><span style={mono}>{fmt(debt)}</span></div>}
              <div className="flex justify-between" style={{ color: MUTED }}><span>Effet sur le bénéfice</span><span style={mono}>{impact >= 0 ? "−" : "+"} {fmt(Math.abs(impact))}</span></div>
            </div>
          )}
          {error && <p className="text-xs flex items-center gap-1" style={{ color: RED }}><AlertCircle size={14} />{error}</p>}
          <div className="flex gap-2 pt-1">
            <button onClick={onClose} style={{ border: `1px solid ${LINE}` }} className="flex-1 rounded-lg py-2 text-sm">Annuler</button>
            <button onClick={confirm} style={{ background: ORANGE, color: "#fff" }} className="flex-1 rounded-lg py-2 text-sm font-medium">Enregistrer le retour</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Credits({ movements, setMovements, title }) {
  const [payKey, setPayKey] = useState(null);
  const [amount, setAmount] = useState("");
  const [error, setError] = useState("");

  const groups = useMemo(() => {
    const map = {};
    movements.filter((m) => m.type === "vente" && m.credit).forEach((m) => {
      const key = m.credit.customer.trim().toLowerCase();
      if (!map[key]) map[key] = { key, name: m.credit.customer.trim(), sales: [] };
      map[key].sales.push(m);
    });
    return Object.values(map)
      .map((g) => ({ ...g, due: g.sales.reduce((a, x) => a + saleDue(x), 0) }))
      .sort((a, b) => b.due - a.due);
  }, [movements]);

  const debtors = groups.filter((g) => g.due > 0);
  const settled = groups.filter((g) => g.due <= 0);
  const totalDue = debtors.reduce((a, g) => a + g.due, 0);
  const current = groups.find((g) => g.key === payKey);

  const history = movements
    .filter((m) => m.type === "vente" && m.credit)
    .flatMap((m) => m.credit.payments.map((p) => ({ ...p, customer: m.credit.customer, product: m.productName })))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
    .slice(0, 15);

  const openPay = (g) => { setPayKey(g.key); setAmount(String(g.due)); setError(""); };

  const confirmPay = () => {
    const amt = +amount;
    if (!amt || amt <= 0) return setError("Saisis un montant valide.");
    if (amt > current.due) return setError(`Le montant dépasse ce que doit le client (${fmt(current.due)}).`);
    let remaining = amt;
    const add = {};
    [...current.sales]
      .filter((x) => saleDue(x) > 0)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
      .forEach((x) => {
        const pay = Math.min(remaining, saleDue(x));
        if (pay > 0) { add[x.id] = pay; remaining -= pay; }
      });
    setMovements(movements.map((m) => add[m.id]
      ? { ...m, credit: { ...m.credit, payments: [...m.credit.payments, { id: uid(), date: todayStr(), amount: add[m.id] }] } }
      : m));
    setPayKey(null);
  };

  return (
    <div>
      <PageHeader title={title} />

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
        <StatCard label="Total à recevoir" value={totalDue} accent={ORANGE} icon={Coins} />
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-5">
          <p className="text-xs" style={{ color: MUTED }}>Clients qui doivent encore payer</p>
          <p className="text-2xl mt-1 font-semibold" style={{ fontFamily: "ui-monospace, monospace" }}>{debtors.length}</p>
        </div>
      </div>

      {debtors.length === 0 ? (
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-6 text-center text-sm">
          <p style={{ color: "#9CA3AF" }}>Aucune vente à crédit en cours.</p>
          <p className="mt-1 text-xs" style={{ color: MUTED }}>Pour en créer une, coche « Vente à crédit » au moment d'encaisser.</p>
        </div>
      ) : (
        <div className="space-y-4">
          {debtors.map((g) => (
            <div key={g.key} style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl overflow-hidden">
              <div className="flex flex-wrap items-center justify-between gap-3 p-4">
                <div>
                  <p className="text-sm font-semibold">{g.name}</p>
                  <p className="text-xs mt-0.5" style={{ color: MUTED }}>Doit : <span style={{ fontFamily: "ui-monospace, monospace", color: ORANGE, fontWeight: 600 }}>{fmt(g.due)}</span></p>
                </div>
                <button onClick={() => openPay(g)} style={{ background: ORANGE, color: "#fff" }} className="rounded-lg px-4 py-2 text-sm font-medium">
                  Enregistrer un paiement
                </button>
              </div>
              <div className="overflow-x-auto" style={{ borderTop: `1px solid ${LINE}` }}>
                <table className="w-full text-sm" style={{ minWidth: 420 }}>
                  <tbody>
                    {g.sales.filter((x) => saleDue(x) > 0).map((x) => (
                      <tr key={x.id} style={{ borderTop: `1px solid ${LINE}` }}>
                        <td className="p-3" style={{ color: MUTED }}>{x.date}</td>
                        <td className="p-3">{x.qty} × {x.productName}</td>
                        <td className="p-3 text-right" style={{ fontFamily: "ui-monospace, monospace" }}>
                          <span style={{ color: MUTED }}>{fmt(salePaid(x))} / {fmt(saleNet(x))}</span>
                        </td>
                        <td className="p-3 text-right" style={{ fontFamily: "ui-monospace, monospace", color: ORANGE }}>reste {fmt(saleDue(x))}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      )}

      {settled.length > 0 && (
        <p className="text-xs mt-5" style={{ color: MUTED }}>Soldés : {settled.map((g) => g.name).join(", ")}</p>
      )}

      {history.length > 0 && (
        <div className="mt-10">
          <p className="text-sm mb-3 font-medium" style={{ color: MUTED }}>Derniers paiements reçus</p>
          <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm" style={{ minWidth: 420 }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${LINE}`, color: MUTED }} className="text-left">
                    <th className="p-3 font-normal">Date</th>
                    <th className="p-3 font-normal">Client</th>
                    <th className="p-3 font-normal">Pour</th>
                    <th className="p-3 font-normal">Montant</th>
                  </tr>
                </thead>
                <tbody>
                  {history.map((p) => (
                    <tr key={p.id} style={{ borderTop: `1px solid ${LINE}` }}>
                      <td className="p-3">{p.date}</td>
                      <td className="p-3">{p.customer}</td>
                      <td className="p-3" style={{ color: MUTED }}>{p.product}</td>
                      <td className="p-3" style={{ fontFamily: "ui-monospace, monospace", color: GREEN }}>{fmt(p.amount)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {current && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(16,27,46,0.45)" }}>
          <div style={{ background: CARD }} className="w-full max-w-sm rounded-xl p-5">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-base font-semibold">Paiement de {current.name}</h3>
              <button onClick={() => setPayKey(null)}><X size={18} style={{ color: MUTED }} /></button>
            </div>
            <p className="text-xs mb-3" style={{ color: MUTED }}>
              Reste dû : <span style={{ fontFamily: "ui-monospace, monospace", color: TEXT, fontWeight: 600 }}>{fmt(current.due)}</span>.
              Le paiement est imputé sur les ventes les plus anciennes d'abord.
            </p>
            <label className="text-xs" style={{ color: MUTED }}>Montant reçu</label>
            <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} autoFocus
              style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
            {error && <p className="text-xs flex items-center gap-1 mt-2" style={{ color: RED }}><AlertCircle size={14} />{error}</p>}
            <div className="flex gap-2 mt-4">
              <button onClick={() => setPayKey(null)} style={{ border: `1px solid ${LINE}` }} className="flex-1 rounded-lg py-2 text-sm">Annuler</button>
              <button onClick={confirmPay} style={{ background: ORANGE, color: "#fff" }} className="flex-1 rounded-lg py-2 text-sm font-medium">Encaisser</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Modale de vente rapide ----------
function QuickSaleModal({ products, presetId, onClose, onConfirm }) {
  const [productId, setProductId] = useState(presetId || "");
  const [qty, setQty] = useState("1");
  const [price, setPrice] = useState(() => {
    const p = products.find((x) => x.id === presetId);
    return p ? p.vente : "";
  });
  const [error, setError] = useState("");
  const [credit, setCredit] = useState(EMPTY_CREDIT);
  const [discount, setDiscount] = useState(EMPTY_DISCOUNT);

  const product = products.find((p) => p.id === productId);
  const subtotalQ = (+qty || 0) * (+price || 0);
  const netQ = subtotalQ - discountAmount(discount, subtotalQ);

  const onSelect = (id) => {
    setProductId(id);
    const p = products.find((x) => x.id === id);
    if (p) setPrice(p.vente);
  };

  const confirm = () => {
    setError("");
    if (!product || !qty || +qty <= 0) return setError("Choisis un produit et une quantité valide.");
    if (+qty > product.stock) return setError(`Stock insuffisant (disponible : ${product.stock}).`);
    const subtotal = +qty * +price;
    const dErr = discountError(discount, subtotal);
    if (dErr) return setError(dErr);
    const disc = discountAmount(discount, subtotal);
    const net = subtotal - disc;
    const cErr = creditError(credit, net);
    if (cErr) return setError(cErr);
    onConfirm(product, +qty, +price, makeCredit(credit, Math.min(+credit.deposit || 0, net)), disc);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(16,27,46,0.45)" }}>
      <div style={{ background: CARD }} className="w-full max-w-sm rounded-xl p-5">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            <Zap size={17} style={{ color: ORANGE }} />
            <h3 className="text-base font-semibold" style={{ color: TEXT }}>Vente rapide</h3>
          </div>
          <button onClick={onClose}><X size={18} style={{ color: MUTED }} /></button>
        </div>

        <div className="space-y-3">
          <div>
            <label className="text-xs" style={{ color: MUTED }}>Produit</label>
            <select value={productId} onChange={(e) => onSelect(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1">
              <option value="">— choisir —</option>
              {products.map((p) => <option key={p.id} value={p.id}>{p.name} (stock : {p.stock})</option>)}
            </select>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-xs" style={{ color: MUTED }}>Quantité</label>
              <input type="number" value={qty} onChange={(e) => setQty(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
            </div>
            <div>
              <label className="text-xs" style={{ color: MUTED }}>Prix unitaire de vente</label>
              <input type="number" value={price} onChange={(e) => setPrice(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
            </div>
          </div>
          {product && qty && (
            <p className="text-xs" style={{ color: MUTED }}>Total : <span style={{ fontFamily: "ui-monospace, monospace", color: TEXT }}>{fmt((+qty || 0) * (+price || 0))}</span></p>
          )}
          <DiscountFields value={discount} onChange={setDiscount} subtotal={subtotalQ} cost={product ? (+qty || 0) * product.achat : 0} />
          <CreditFields value={credit} onChange={setCredit} total={netQ} />
          {error && <p className="text-xs flex items-center gap-1" style={{ color: RED }}><AlertCircle size={14} />{error}</p>}
          <div className="flex gap-2 pt-1">
            <button onClick={onClose} style={{ border: `1px solid ${LINE}` }} className="flex-1 rounded-lg py-2 text-sm">Annuler</button>
            <button onClick={confirm} style={{ background: ORANGE, color: "#fff" }} className="flex-1 rounded-lg py-2 text-sm font-medium">Encaisser</button>
          </div>
        </div>
      </div>
    </div>
  );
}

        ? { ...p, name: form.name, category: form.category.trim(), achat: +form.achat, vente: +form.vente, seuil: +form.seuil || 0, supplierId: form.supplierId || null }
        : p)));

        id: uid(), name: form.name.trim(), category: form.category.trim(),

// ---------- Mouvements : Ventes et Entrées séparées, chacune avec son propre environnement ----------
function Movements({ products, setProducts, movements, setMovements, title, boutiqueName }) {
  const [subTab, setSubTab] = useState("vente");
  const [pendingRemove, setPendingRemove] = useState(null);
  const [returnSale, setReturnSale] = useState(null);
  const [undoRet, setUndoRet] = useState(null);
  const [receipt, setReceipt] = useState(null);

  // Annuler une vente remet en stock ce qui n'est pas déjà revenu par un retour
  const removeMovement = (mv) => {
    setMovements(movements.filter((m) => m.id !== mv.id));
    setProducts(products.map((p) => p.id === mv.productId ? { ...p, stock: p.stock + (mv.type === "entree" ? -mv.qty : mv.qty - returnedQty(mv)) } : p));
  };

  const confirmReturn = (data) => {
    const sale = returnSale;
    setMovements(movements.map((m) => m.id === sale.id ? { ...m, returns: [...saleReturns(m), data] } : m));
    if (data.restock) setProducts(products.map((p) => p.id === sale.productId ? { ...p, stock: p.stock + data.qty } : p));
    const debt = data.refund - data.cashRefund;
    const now = new Date();
    setReceipt({
      items: [{ name: sale.productName, qty: data.qty, price: data.refund / data.qty }],
      total: data.refund,
      extra: [
        ...(sale.credit ? [["Client", sale.credit.customer]] : []),
        ...(data.cashRefund > 0 ? [["Rendu en espèces", fmt(data.cashRefund)]] : []),
        ...(debt > 0 ? [["Déduit de la dette", fmt(debt)]] : []),
      ],
      dateLabel: now.toLocaleDateString("fr-FR"),
      timeLabel: now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
    });
    setReturnSale(null);
  };

  const confirmUndoReturn = () => {
    const { sale, ret } = undoRet;
    setMovements(movements.map((m) => m.id === sale.id ? { ...m, returns: saleReturns(m).filter((r) => r.id !== ret.id) } : m));
    if (ret.restock) setProducts(products.map((p) => p.id === sale.productId ? { ...p, stock: Math.max(0, p.stock - ret.qty) } : p));
    setUndoRet(null);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <h2 className="text-2xl font-semibold" style={{ color: TEXT }}>{title}</h2>
      </div>

      <div className="flex flex-wrap gap-2 mb-6">
        <button onClick={() => setSubTab("vente")}
          className="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium"
          style={{ background: subTab === "vente" ? NAVY : CARD, color: subTab === "vente" ? "#fff" : TEXT, border: `1px solid ${LINE}` }}>
          <ArrowUpCircle size={16} /> Ventes
        </button>
        <button onClick={() => setSubTab("entree")}
          className="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium"
          style={{ background: subTab === "entree" ? NAVY : CARD, color: subTab === "entree" ? "#fff" : TEXT, border: `1px solid ${LINE}` }}>
          <ArrowDownCircle size={16} /> Entrées (réassort)
        </button>
        <button onClick={() => setSubTab("retour")}
          className="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium"
          style={{ background: subTab === "retour" ? NAVY : CARD, color: subTab === "retour" ? "#fff" : TEXT, border: `1px solid ${LINE}` }}>
          <RotateCcw size={16} /> Retours
        </button>
      </div>

      {subTab === "vente" && (
        <SalesPanel products={products} setProducts={setProducts} movements={movements} setMovements={setMovements} onRemove={setPendingRemove} onReturn={setReturnSale} />
      )}
      {subTab === "entree" && (
        <EntriesPanel products={products} setProducts={setProducts} movements={movements} setMovements={setMovements} onRemove={setPendingRemove} />
      )}
      {subTab === "retour" && <ReturnsPanel movements={movements} onUndo={(sale, ret) => setUndoRet({ sale, ret })} />}

      {returnSale && <ReturnModal sale={returnSale} onClose={() => setReturnSale(null)} onConfirm={confirmReturn} />}
      {undoRet && (
        <ConfirmModal
          title="Annuler ce retour ?"
          message={`Le retour de ${undoRet.ret.qty} × "${undoRet.sale.productName}" (${fmt(undoRet.ret.refund)}) sera supprimé${undoRet.ret.restock ? " et ces articles seront retirés du stock" : ""}. La vente retrouvera sa valeur d'origine.`}
          confirmLabel="Annuler le retour"
          onCancel={() => setUndoRet(null)}
          onConfirm={confirmUndoReturn}
        />
      )}
      {receipt && (
        <ReceiptModal boutiqueName={boutiqueName} items={receipt.items} total={receipt.total}
          dateLabel={receipt.dateLabel} timeLabel={receipt.timeLabel} title="Bon de retour"
          totalLabel="Montant du retour" footer="Retour enregistré" extra={receipt.extra} onClose={() => setReceipt(null)} />
      )}

      {pendingRemove && (
        <ConfirmModal
          title={pendingRemove.type === "vente" ? "Annuler cette vente ?" : "Annuler cette entrée ?"}
          message={
            pendingRemove.type === "vente"
              ? `${pendingRemove.qty} × "${pendingRemove.productName}" (${fmt(pendingRemove.totalVente)}) sera retiré de l'historique et le stock sera restauré.`
              : `${pendingRemove.qty} × "${pendingRemove.productName}" (${fmt(pendingRemove.totalAchat)}) sera retiré de l'historique et le stock sera diminué en conséquence.`
          }
          confirmLabel="Annuler le mouvement"
          onCancel={() => setPendingRemove(null)}
          onConfirm={() => { removeMovement(pendingRemove); setPendingRemove(null); }}
        />
      )}
    </div>
  );
}

// ---------- Environnement des ventes ----------
function SalesPanel({ products, setProducts, movements, setMovements, onRemove, onReturn }) {
  const [showForm, setShowForm] = useState(false);
  const [productId, setProductId] = useState("");
  const [qty, setQty] = useState("");
  const [unitPrice, setUnitPrice] = useState("");
  const [error, setError] = useState("");
  const [credit, setCredit] = useState(EMPTY_CREDIT);
  const [discount, setDiscount] = useState(EMPTY_DISCOUNT);

  const product = products.find((p) => p.id === productId);
  const ventes = movements.filter((mv) => mv.type === "vente");
  const subtotalS = (+qty || 0) * (+unitPrice || 0);
  const netS = subtotalS - discountAmount(discount, subtotalS);

  const onSelectProduct = (id) => {
    setProductId(id);
    const p = products.find((x) => x.id === id);
    if (p) setUnitPrice(p.vente);
  };

  const submit = () => {
    setError("");
    if (!product || !qty || +qty <= 0) return setError("Choisis un produit et une quantité valide.");
    if (+qty > product.stock) return setError(`Stock insuffisant (disponible : ${product.stock}).`);
    const q = +qty;
    const subtotal = q * +unitPrice;
    const dErr = discountError(discount, subtotal);
    if (dErr) return setError(dErr);
    const disc = discountAmount(discount, subtotal);
    const net = subtotal - disc;
    const cErr = creditError(credit, net);
    if (cErr) return setError(cErr);
    const mv = {
      id: uid(), type: "vente", productId, productName: product.name, qty: q, date: todayStr(),
      unitVente: +unitPrice, unitAchat: product.achat,
      totalVente: net, totalAchat: q * product.achat,
      ...(disc > 0 ? { discount: disc } : {}),
      ...(credit.on ? { credit: makeCredit(credit, Math.min(+credit.deposit || 0, net)) } : {}),
    };
    setMovements([mv, ...movements]);
    setProducts(products.map((p) => p.id === productId ? { ...p, stock: p.stock - q } : p));
    setProductId(""); setQty(""); setUnitPrice(""); setCredit(EMPTY_CREDIT); setDiscount(EMPTY_DISCOUNT); setShowForm(false);
  };

  return (
    <div>
      <div className="flex justify-end mb-4">
        <button onClick={() => setShowForm(true)} style={{ background: ORANGE, color: "#fff" }}
          className="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium">
          <Plus size={16} /> Nouvelle vente
        </button>
      </div>

      {showForm && (
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-4 mb-6">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 items-end">
            <div className="col-span-2 sm:col-span-2">
              <label className="text-xs" style={{ color: MUTED }}>Produit</label>
              <select value={productId} onChange={(e) => onSelectProduct(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1">
                <option value="">— choisir —</option>
                {products.map((p) => <option key={p.id} value={p.id}>{p.name} (stock : {p.stock})</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs" style={{ color: MUTED }}>Quantité</label>
              <input type="number" value={qty} onChange={(e) => setQty(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
            </div>
            <div>
              <label className="text-xs" style={{ color: MUTED }}>Prix unitaire de vente</label>
              <input type="number" value={unitPrice} onChange={(e) => setUnitPrice(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
            </div>
          </div>
          {product && qty && (
            <p className="text-xs mt-3" style={{ color: MUTED }}>Total de la vente : <span style={{ fontFamily: "ui-monospace, monospace", color: TEXT }}>{fmt((+qty || 0) * (+unitPrice || 0))}</span></p>
          )}
          <div className="mt-3"><DiscountFields value={discount} onChange={setDiscount} subtotal={subtotalS} cost={product ? (+qty || 0) * product.achat : 0} /></div>
          <div className="mt-3"><CreditFields value={credit} onChange={setCredit} total={netS} /></div>
          {error && <p className="text-xs flex items-center gap-1 mt-2" style={{ color: RED }}><AlertCircle size={14} />{error}</p>}
          <div className="flex gap-2 mt-3">
            <button onClick={submit} style={{ background: ORANGE, color: "#fff" }} className="rounded-lg px-4 py-1.5 text-sm font-medium">Enregistrer la vente</button>
            <button onClick={() => setShowForm(false)} style={{ border: `1px solid ${LINE}` }} className="rounded-lg px-4 py-1.5 text-sm">Annuler</button>
          </div>
        </div>
      )}

      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl overflow-hidden">
        <div className="overflow-x-auto"><table className="w-full text-sm" style={{ minWidth: 560 }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${LINE}`, color: MUTED }} className="text-left">
              <th className="p-3 font-normal">Date</th>
              <th className="p-3 font-normal">Produit</th>
              <th className="p-3 font-normal">Qté</th>
              <th className="p-3 font-normal">Prix unitaire</th>
              <th className="p-3 font-normal">Total</th>
              <th className="p-3 font-normal"></th>
            </tr>
          </thead>
          <tbody>
            {ventes.length === 0 && (
              <tr><td colSpan={6} className="p-4 text-center text-sm" style={{ color: "#9CA3AF" }}>Aucune vente enregistrée.</td></tr>
            )}
            {ventes.map((mv) => (
              <tr key={mv.id} style={{ borderTop: `1px solid ${LINE}` }}>
                <td className="p-3">{mv.date}</td>
                <td className="p-3">{mv.productName}</td>
                <td className="p-3" style={{ fontFamily: "ui-monospace, monospace" }}>{mv.qty}</td>
                <td className="p-3" style={{ fontFamily: "ui-monospace, monospace" }}>{fmt(mv.unitVente)}</td>
                <td className="p-3" style={{ fontFamily: "ui-monospace, monospace", color: GREEN }}>
                  {fmt(mv.totalVente)}
                  {mv.discount > 0 && <div className="text-xs" style={{ color: MUTED }}>remise − {fmt(mv.discount)}</div>}
                  {returnedQty(mv) > 0 && <div className="text-xs" style={{ color: RED }}>Retourné : {returnedQty(mv)} (− {fmt(returnedValue(mv))})</div>}
                  {saleDue(mv) > 0 && (
                    <div className="text-xs" style={{ color: ORANGE }}>Crédit {mv.credit.customer} — reste {fmt(saleDue(mv))}</div>
                  )}
                </td>
                <td className="p-3 text-right whitespace-nowrap">
                  <button onClick={() => onReturn(mv)} disabled={mv.qty - returnedQty(mv) <= 1e-9}
                    className="inline-flex p-1.5 rounded-md hover:bg-gray-100 disabled:opacity-30" title="Enregistrer un retour"><RotateCcw size={14} style={{ color: ORANGE }} /></button>
                  <button onClick={() => onRemove(mv)} className="inline-flex p-1.5 rounded-md hover:bg-gray-100" title="Annuler"><Trash2 size={14} style={{ color: RED }} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>
    </div>
  );
}

    if (!label.trim() || !amount || +amount <= 0) return;
    setExpenses([{ id: uid(), label: label.trim(), category: category.trim(), amount: +amount, date }, ...expenses]);
    setLabel(""); setCategory(""); setAmount(""); setShowForm(false);

    <div>

            <label className="text-xs" style={{ color: MUTED }}>Catégorie</label>

            <datalist id="exp-cat-list">{categories.map((c) => <option key={c} value={c} />)}</datalist>

        <div className="overflow-x-auto"><table className="w-full text-sm" style={{ minWidth: 560 }}>

            <tr style={{ borderBottom: `1px solid ${LINE}`, color: MUTED }} className="text-left">
              <th className="p-3 font-normal">Date</th>
              <th className="p-3 font-normal">Libellé</th>
              <th className="p-3 font-normal">Catégorie</th>
              <th className="p-3 font-normal">Montant</th>
              <th className="p-3 font-normal"></th>
            </tr>
          </thead>
          <tbody>
            {expenses.length === 0 && (
              <tr><td colSpan={5} className="p-4 text-center text-sm" style={{ color: "#9CA3AF" }}>Aucune dépense enregistrée.</td></tr>
            )}
            {expenses.map((e) => (
              <tr key={e.id} style={{ borderTop: `1px solid ${LINE}` }}>
                <td className="p-3">{e.date}</td>
                <td className="p-3">{e.label}</td>
                <td className="p-3">
                  {e.category ? (
                    <span style={{ background: "#EEF1F5", color: "#4B5666" }} className="text-xs rounded-full px-2 py-0.5">{e.category}</span>
                  ) : (
                    <span style={{ color: "#C3C8D1" }}>—</span>
                  )}
                </td>
                <td className="p-3" style={{ fontFamily: "ui-monospace, monospace", color: RED }}>{fmt(e.amount)}</td>
                <td className="p-3 text-right">
                  <button onClick={() => setPendingDelete(e)} className="inline-flex p-1.5 rounded-md hover:bg-gray-100" title="Supprimer"><Trash2 size={14} style={{ color: RED }} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>

      {pendingDelete && (
        <ConfirmModal
          title="Supprimer cette dépense ?"
          message={`"${pendingDelete.label}" (${fmt(pendingDelete.amount)}) sera définitivement retirée de l'historique et du calcul de la caisse.`}
          onCancel={() => setPendingDelete(null)}
          onConfirm={() => { remove(pendingDelete.id); setPendingDelete(null); }}
        />
      )}
    </div>
  );
}
