// ---------- Dépenses ----------
function Expenses({ expenses, setExpenses, title }) {
  const [showForm, setShowForm] = useState(false);
  const [label, setLabel] = useState("");
  const [category, setCategory] = useState("");
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayStr());

  const categories = [...new Set(expenses.map((e) => e.category).filter(Boolean))].sort();

  const add = () => {
    if (!label.trim() || !amount || +amount <= 0) return;
    setExpenses([{ id: uid(), label: label.trim(), category: category.trim(), amount: +amount, date }, ...expenses]);
    setLabel(""); setCategory(""); setAmount(""); setShowForm(false);
  };
  const remove = (id) => setExpenses(expenses.filter((e) => e.id !== id));
  const [pendingDelete, setPendingDelete] = useState(null);

  return (
    <div>
      <PageHeader title={title} actionLabel="Ajouter une dépense" onAction={() => setShowForm(true)} />

      {showForm && (
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl p-4 mb-6 grid grid-cols-2 sm:grid-cols-5 gap-3 items-end">
          <div className="col-span-2">
            <label className="text-xs" style={{ color: MUTED }}>Libellé (loyer, facture…)</label>
            <input value={label} onChange={(e) => setLabel(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
          </div>
          <div>
            <label className="text-xs" style={{ color: MUTED }}>Catégorie</label>
            <input value={category} onChange={(e) => setCategory(e.target.value)} list="exp-cat-list"
              placeholder="Ex : Loyer" style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
            <datalist id="exp-cat-list">{categories.map((c) => <option key={c} value={c} />)}</datalist>
          </div>
          <div>
            <label className="text-xs" style={{ color: MUTED }}>Montant</label>
            <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
          </div>
          <div>
            <label className="text-xs" style={{ color: MUTED }}>Date</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ border: `1px solid ${LINE}` }} className="w-full rounded-lg px-2 py-1.5 text-sm mt-1" />
          </div>
          <div className="col-span-2 sm:col-span-5 flex gap-2">
            <button onClick={add} style={{ background: ORANGE, color: "#fff" }} className="rounded-lg px-4 py-1.5 text-sm font-medium">Ajouter</button>
            <button onClick={() => setShowForm(false)} style={{ border: `1px solid ${LINE}` }} className="rounded-lg px-4 py-1.5 text-sm">Annuler</button>
          </div>
        </div>
      )}

      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-xl overflow-hidden">
        <div className="overflow-x-auto"><table className="w-full text-sm" style={{ minWidth: 560 }}>
          <thead>
            <tr style={{ borderBottom: `1px solid ${LINE}`, color: MUTED }} className="text-left">
              <th className="p-3 font-normal">Date</th>
              <th className="p-3 font-normal">Libellé</th>
              <th className="p-3 font-normal">Catégorie</th>
              <th className="p-3 font-normal">Montant</th>
              <th className="p-3 font-normal"></th>
            </tr>
          </thead>
          <tbody>
            {expenses.length === 0 && (
              <tr><td colSpan={5} className="p-4 text-center text-sm" style={{ color: "#9CA3AF" }}>Aucune dépense enregistrée.</td></tr>
            )}
            {expenses.map((e) => (
              <tr key={e.id} style={{ borderTop: `1px solid ${LINE}` }}>
                <td className="p-3">{e.date}</td>
                <td className="p-3">{e.label}</td>
                <td className="p-3">
                  {e.category ? (
                    <span style={{ background: "#EEF1F5", color: "#4B5666" }} className="text-xs rounded-full px-2 py-0.5">{e.category}</span>
                  ) : (
                    <span style={{ color: "#C3C8D1" }}>—</span>
                  )}
                </td>
                <td className="p-3" style={{ fontFamily: "ui-monospace, monospace", color: RED }}>{fmt(e.amount)}</td>
                <td className="p-3 text-right">
                  <button onClick={() => setPendingDelete(e)} className="inline-flex p-1.5 rounded-md hover:bg-gray-100" title="Supprimer"><Trash2 size={14} style={{ color: RED }} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>

      {pendingDelete && (
        <ConfirmModal
          title="Supprimer cette dépense ?"
          message={`"${pendingDelete.label}" (${fmt(pendingDelete.amount)}) sera définitivement retirée de l'historique et du calcul de la caisse.`}
          onCancel={() => setPendingDelete(null)}
          onConfirm={() => { remove(pendingDelete.id); setPendingDelete(null); }}
        />
      )}
    </div>
  );
}

// ---------- Racine ----------
function App() {
  const [boutique, setBoutique] = useState(null);
  if (!boutique) return <LoginScreen onEnter={setBoutique} />;
  return <ShopApp boutique={boutique} onLogout={() => setBoutique(null)} />;
}


const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(React.createElement(App));

</script>
</body>
